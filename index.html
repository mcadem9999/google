<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart 4K Turbo Browser</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: white; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* شاشة التحميل الرائعة */
        .loader {
            border: 5px solid #333;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #status-text { margin-top: 20px; font-size: 1.2rem; color: #aaa; }

        /* شريط الإدخال (يظهر فقط عند الحاجة) */
        #setup-ui { text-align: center; z-index: 100; }
        input {
            padding: 15px; width: 400px; border-radius: 30px; border: none;
            font-size: 18px; outline: none; margin-bottom: 20px; text-align: center;
        }
        button {
            padding: 12px 30px; border-radius: 25px; border: none;
            background: #3498db; color: white; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="setup-ui">
        <h1>Smart 4K Browser</h1>
        <input type="text" id="url-input" placeholder="ادخل الرابط (مثلاً google.com)" onkeydown="if(event.keyCode==13) startBrowsing()">
        <br>
        <button onclick="startBrowsing()">انطلق بسرعة</button>
        <p style="color: #666; margin-top: 20px;">اضغط على زر OK في الريموت للإدخال</p>
    </div>

    <div id="loading-ui" style="display: none;">
        <div class="loader"></div>
        <div id="status-text">جاري تشغيل المحرك بسرعة خرافية...</div>
    </div>

    <script>
        // دالة البدء
        function startBrowsing() {
            var url = document.getElementById('url-input').value.trim();
            if (!url) return;

            // التأكد من صيغة الرابط
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            // إخفاء الواجهة وإظهار التحميل
            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('loading-ui').style.display = 'block';

            // أهم سطر للسرعة: التحويل المباشر
            // هذا يلغي الـ iframe ويجعل الموقع هو التطبيق الأساسي
            setTimeout(function() {
                window.location.replace(url);
            }, 500);
        }

        // معالجة أزرار الريموت
        document.addEventListener('keydown', function(e) {
            // زر العودة (Back) في LG WebOS
            if (e.keyCode === 461) {
                // إذا كنا في الصفحة الرئيسية للتطبيق، لا تفعل شيئاً أو اخرج
                // لكن بعد التحويل، الموقع المستهدف سيتولى زر العودة
                window.history.back();
            }
        });

        // جعل التركيز تلقائياً على خانة الإدخال عند الفتح
        window.onload = function() {
            document.getElementById('url-input').focus();
        };
    </script>
</body>
</html>
