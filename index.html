<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google 4K Ultra</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        /* إطار العرض الكامل */
        #web-container { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="web-container" src="https://www.google.com" allowfullscreen></iframe>

    <script>
        const frame = document.getElementById('web-container');

        // سكريبت الكنترولر القسري
        document.addEventListener('keydown', function(e) {
            const scrollStep = 150; // سرعة التمرير
            
            // إرسال أمر التمرير مباشرة إلى نافذة الـ iframe
            if (e.keyCode === 40) { // سهم لأسفل
                frame.contentWindow.postMessage({ type: 'scroll', direction: 'down' }, '*');
                window.scrollBy(0, scrollStep); 
            }
            if (e.keyCode === 38) { // سهم لأعلى
                window.scrollBy(0, -scrollStep);
            }
            if (e.keyCode === 461) { // زر الرجوع
                window.history.back();
            }
        });

        // تفعيل التمرير عبر بكرة الريموت
        window.addEventListener('wheel', function(e) {
            window.scrollBy(0, e.deltaY);
        });

        // محاولة إجبار المحتوى على التوجيه المباشر إذا فشل الـ iframe
        frame.onerror = function() {
            window.location.replace("https://www.google.com");
        };
    </script>
</body>
</html>
    </script>
</body>
</html>
