<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart 4K Browser</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* شريط الأدوات العلوي */
        #toolbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(30, 30, 30, 0.9); display: flex; align-items: center;
            padding: 0 15px; z-index: 9999; transition: transform 0.3s;
            transform: translateY(-100%); /* مخفي افتراضياً */
        }
        body:hover #toolbar { transform: translateY(0); } /* يظهر عند تحريك الماوس للأعلى */

        input#url-input {
            flex: 1; height: 35px; border-radius: 20px; border: none; padding: 0 20px;
            margin: 0 10px; font-size: 16px; outline: none;
        }
        
        button {
            background: #444; color: white; border: none; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        #browser-frame { width: 100%; height: 100%; border: none; margin-top: 0; }
    </style>
</head>
<body>

    <div id="toolbar">
        <button onclick="window.history.back()">↩ رجوع</button>
        <input type="text" id="url-input" placeholder="ادخل الرابط هنا (مثلاً youtube.com)..." onkeydown="if(event.keyCode==13) loadUrl()">
        <button onclick="location.reload()">🔄 تحديث</button>
    </div>

    <iframe id="browser-frame" src="https://www.google.com" allowfullscreen></iframe>

    <script>
        function loadUrl() {
            var url = document.getElementById('url-input').value;
            if (!url.startsWith('http')) url = 'https://' + url;
            document.getElementById('browser-frame').src = url;
        }

        // دعم زر العودة من الريموت (Back)
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 461) window.history.back();
        });
    </script>
</body>
</html>
