<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 4K Browser</title>
    <style>
        /* تفعيل التمرير على مستوى الجسم */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: auto !important; /* السماح بالتمرير إجبارياً */
            background-color: #000;
            -webkit-overflow-scrolling: touch; /* تنعيم التمرير لشاشات LG */
        }
    </style>
</head>
<body>
    <script type="text/javascript">
        // التوجيه المباشر يجعل المتصفح الداخلي للشاشة يتولى السكرول تلقائياً
        window.location.replace("https://www.google.com");

        // كود إضافي لإجبار الشاشة على فهم أزرار الريموت للتمرير
        document.addEventListener('keydown', function(e) {
            const scrollAmount = 200; // مسافة التمرير في كل ضغطة
            if (e.keyCode === 40) window.scrollBy(0, scrollAmount); // سهم لأسفل
            if (e.keyCode === 38) window.scrollBy(0, -scrollAmount); // سهم لأعلى
            if (e.keyCode === 461) window.history.back(); // زر الرجوع
        });
    </script>
</body>
</html>
