<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG Ultra Browser</title>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        #controls { 
            position: fixed; top: 0; width: 100%; height: 50px; 
            background: #222; display: flex; align-items: center; 
            padding: 5px; z-index: 100; box-sizing: border-box;
        }
        input { flex: 1; margin: 0 10px; padding: 8px; border-radius: 5px; border: none; }
        button { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="window.history.back()">↩</button>
        <input type="text" id="urlInput" placeholder="اكتب الموقع هنا واضغط Go..." onkeydown="if(event.keyCode==13) navigate()">
        <button onclick="navigate()">Go!</button>
    </div>

    <script>
        function navigate() {
            var url = document.getElementById('urlInput').value;
            if (url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                // التحويل المباشر هو الوحيد الذي يتخطى حماية Google وYouTube
                window.location.assign(url); 
            }
        }
        
        // التوجيه التلقائي عند فتح التطبيق لأول مرة
        window.onload = function() {
            // ننتظر ثانية واحدة لضمان استقرار النظام ثم نفتح جوجل
            setTimeout(function() {
                if (window.location.href.includes('index.html')) {
                   // لا نستخدم iframe هنا لضمان عمل اليوتيوب والتمرير
                }
            }, 1000);
        };
    </script>
</body>
</html>
    </script>
</body>
</html>
