<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #app-canvas { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>
    <iframe id="app-canvas" src="https://www.google.com"></iframe>

    <script>
        const view = document.getElementById('app-canvas');

        // محاكي التحكم الخاص بـ webOS (Controller Script)
        document.addEventListener('keydown', (e) => {
            const step = 200;
            const key = e.keyCode;

            // حقن أوامر التمرير داخل الـ iframe
            if (key === 40) window.scrollBy({top: step, behavior: 'smooth'}); // أسفل
            if (key === 38) window.scrollBy({top: -step, behavior: 'smooth'}); // أعلى
            
            // زر العودة (Back) - مقتبس من سكريبت يوتيوب
            if (key === 461) {
                e.preventDefault();
                view.contentWindow.history.back();
            }
        });

        // تفعيل "الماوس الافتراضي" عند تحريك البكرة
        window.addEventListener('wheel', (e) => {
            window.scrollBy(0, e.deltaY);
        });
    </script>
</body>
</html>
